<!DOCTYPE html>
<html><head>
<title>Featured Products Review</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f7; }
  h1 { text-align: center; }
  .toolbar { text-align: center; margin: 16px 0; position: sticky; top: 0; background: #f5f5f7; padding: 12px 0; z-index: 10; border-bottom: 1px solid #ddd; }
  .toolbar button { padding: 8px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; margin: 0 6px; }
  .toolbar .download { background: #059669; color: white; }
  .toolbar .download:hover { background: #047857; }
  .stats { font-size: 13px; color: #666; margin: 0 12px; display: inline; }
  .swaps { font-size: 13px; color: #004cb9; font-weight: 600; margin: 0 8px; }
  h2 { margin-top: 30px; padding: 10px; border-radius: 8px; }
  h2.hits { background: #e8f0fe; color: #004cb9; }
  h2.staff { background: #d1fae5; color: #059669; }
  h2.cool { background: #f3e8ff; color: #7c3aed; }
  h2.movement { background: #fee2e2; color: #BF0A30; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .card { background: white; border-radius: 12px; overflow: hidden; border: 2px solid #34d399; position: relative; transition: all 0.3s; }
  .card.swapping { opacity: 0; transform: scale(0.9); }
  .card img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
  .card .no-img { height: 100px; background: #eee; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 11px; }
  .card .info { padding: 8px 10px; }
  .card .title { font-size: 11px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .title a { color: inherit; text-decoration: none; }
  .card .title a:hover { text-decoration: underline; }
  .card .price { font-size: 11px; color: #004cb9; font-weight: 600; }
  .card .store { font-size: 10px; color: #999; margin-top: 3px; }
  .card .section { font-size: 9px; color: #bbb; }
  .card .vote-btns { display: flex; border-top: 1px solid #eee; }
  .card .vote-btns button { flex: 1; padding: 8px; border: none; font-size: 18px; cursor: pointer; background: white; transition: background 0.1s; }
  .card .vote-btns .no-btn { color: #ef4444; }
  .card .vote-btns .no-btn:hover { background: #fee2e2; }
  .card .vote-btns .yes-btn { color: #10b981; background: #d1fae5; }
  .count { font-size: 14px; color: #999; font-weight: normal; }
  .round-info { text-align: center; color: #999; font-size: 13px; margin-bottom: 8px; }
</style>
</head><body>
<h1>Featured Products Review</h1>
<div class="toolbar">
  <button class="download" onclick="downloadJSON()">Download featured.json</button>
  <span class="stats" id="stats"></span>
  <span class="swaps" id="swaps"></span>
</div>
<div class="round-info">Click <strong>X</strong> to reject — a replacement loads instantly. Click <strong>Download</strong> when done.</div>
<div id="content"></div>
<script>
let featured = [];
let allProducts = [];
let usedIds = new Set();
let rejectedIds = new Set();
let swapCount = 0;

const BUCKET_ORDER = ['hits', 'staff', 'cool', 'movement'];
const LABELS = { hits: 'The Hits', staff: 'Staff', cool: 'Cool', movement: 'Movement' };

Promise.all([
  fetch('/data/featured.json').then(r => r.json()),
  fetch('/data/products.json').then(r => r.json()),
]).then(([feat, prods]) => {
  featured = feat;
  allProducts = prods.filter(p => p.image && p.price && parseFloat(p.price) > 0);
  featured.forEach(f => usedIds.add(f.id));
  render();
});

function updateStats() {
  document.getElementById('stats').textContent = featured.length + ' items';
  document.getElementById('swaps').textContent = swapCount > 0 ? swapCount + ' swaps made' : '';
}

function renderCard(p) {
  return '<div class="card" data-id="' + p.id + '" data-bucket="' + p.pick + '">' +
    (p.image ? '<img src="' + p.image + '" alt="" loading="lazy">' : '<div class="no-img">No image</div>') +
    '<div class="info">' +
    '<div class="title"><a href="' + p.url + '" target="_blank">' + escHtml(p.title) + '</a></div>' +
    '<div class="price">$' + p.price + '</div>' +
    '<div class="store">' + escHtml(p.store_name) + '</div>' +
    '<div class="section">' + escHtml(p.site_section || '') + '</div>' +
    '</div>' +
    '<div class="vote-btns">' +
    '<button class="yes-btn" title="Keep">&#10003;</button>' +
    '<button class="no-btn" onclick="rejectItem(\'' + p.id + '\')">&#10007;</button>' +
    '</div></div>';
}

function render() {
  const buckets = { hits: [], staff: [], cool: [], movement: [] };
  featured.forEach(f => buckets[f.pick]?.push(f));

  const el = document.getElementById('content');
  el.innerHTML = '';
  for (const key of BUCKET_ORDER) {
    const list = buckets[key];
    el.innerHTML += '<h2 class="' + key + '">' + LABELS[key] + ' <span class="count">(' + list.length + ' items)</span></h2>';
    let grid = '<div class="grid">';
    list.forEach(p => { grid += renderCard(p); });
    grid += '</div>';
    el.innerHTML += grid;
  }
  updateStats();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function findReplacement(bucket, section) {
  const currentStores = new Set(featured.filter(f => f.pick === bucket).map(f => f.store_name));

  // For movement bucket, only allow books/media
  const sectionFilter = bucket === 'movement'
    ? p => p.site_section === 'Books' || p.site_section === 'Media & Publishing'
    : p => true;

  const candidates = allProducts.filter(p =>
    !usedIds.has(p.id) &&
    !rejectedIds.has(p.id) &&
    !currentStores.has(p.store_name) &&
    sectionFilter(p)
  );

  // Prefer same section, then random
  let pick = candidates.find(p => p.site_section === section);
  if (!pick && candidates.length > 0) {
    pick = candidates[Math.floor(Math.random() * candidates.length)];
  }
  return pick;
}

function rejectItem(id) {
  const card = document.querySelector('.card[data-id="' + id + '"]');
  if (!card) return;

  const item = featured.find(f => f.id === id);
  if (!item) return;

  const bucket = item.pick;
  const section = item.site_section;

  // Find replacement before removing
  const replacement = findReplacement(bucket, section);

  // Animate out
  card.classList.add('swapping');

  setTimeout(() => {
    // Remove rejected item
    featured = featured.filter(f => f.id !== id);
    rejectedIds.add(id);
    // Don't remove from usedIds so it won't come back

    if (replacement) {
      const newItem = { ...replacement, pick: bucket };
      featured.push(newItem);
      usedIds.add(replacement.id);

      // Replace card HTML in-place
      card.outerHTML = renderCard(newItem);
    } else {
      card.remove();
    }

    swapCount++;
    updateStats();

    // Update bucket count in header
    const bucketCount = featured.filter(f => f.pick === bucket).length;
    const headers = document.querySelectorAll('h2.' + bucket + ' .count');
    headers.forEach(h => h.textContent = '(' + bucketCount + ' items)');
  }, 200);
}

function downloadJSON() {
  const output = featured.map(({ _new, ...rest }) => rest);
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'featured.json';
  a.click();
}
</script>
</body></html>
